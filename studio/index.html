<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperCut Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e1e2e; z-index: 10; transition: opacity .3s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #a6e3a1; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hyperframes/player"></script>
</head>
<body>
  <div id="loading">
    <div style="text-align:center">
      <div class="spinner"></div>
      <p id="loading-text" style="font-size:14px;opacity:.7">Loading composition...</p>
    </div>
  </div>
  <hyperframes-player id="hf-player" controls muted style="display:block;width:100%;height:100%"></hyperframes-player>
  <script>
    (function() {
      var params = new URLSearchParams(location.search);
      var jobId = params.get('job_id');
      var player = document.getElementById('hf-player');
      var loading = document.getElementById('loading');
      var loadingText = document.getElementById('loading-text');

      function post(type, payload) {
        window.parent.postMessage({ type: type, payload: payload || {} }, '*');
      }

      if (!jobId) {
        loadingText.textContent = 'Missing job_id parameter';
        post('error', { message: 'Missing job_id parameter' });
        return;
      }

      var compUrl = '/api/composition/' + encodeURIComponent(jobId);
      player.setAttribute('src', compUrl);
      post('hypercut-studio-ready');

      player.addEventListener('ready', function() {
        loading.classList.add('hidden');
        post('composition-loaded', { jobId: jobId });
      });

      player.addEventListener('error', function(e) {
        console.error('Player error:', e.detail);
        loadingText.textContent = 'Failed to load composition.';
        post('error', { message: (e.detail && e.detail.message) || 'Player error' });
      });

      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'hypercut-reload-composition') {
          var src = '/api/composition/' + encodeURIComponent(jobId);
          player.setAttribute('src', src);
          loading.classList.remove('hidden');
          loadingText.textContent = 'Reloading composition...';
        }
      });
    })();
  </script>
</body>
</html>
