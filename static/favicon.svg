<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1e1e2e"/>
  <!-- silicon wafer circle -->
  <circle cx="16" cy="17" r="9" fill="none" stroke="#89b4fa" stroke-width="1.2" opacity="0.4"/>
  <!-- circuit trace ring -->
  <circle cx="16" cy="17" r="6.5" fill="none" stroke="#89b4fa" stroke-width="0.6" opacity="0.3" stroke-dasharray="2,2"/>
  <!-- sprout stem -->
  <path d="M16 26 L16 20" fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- left leaf -->
  <path d="M16 20 Q12 16 9 18 Q12 21 16 20" fill="#a6e3a1"/>
  <!-- right leaf -->
  <path d="M16 17 Q20 13 23 15 Q20 18 16 17" fill="#a6e3a1"/>
  <!-- seed dot -->
  <circle cx="16" cy="26" r="1.5" fill="#f9e2af"/>
